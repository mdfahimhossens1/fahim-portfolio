<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="#0b1220" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Subtle glow backdrop -->
  <rect x="50" y="50" width="412" height="412" rx="90" ry="90" fill="#10192d" opacity="0.9" />

  <!-- Code Bracket Left < -->
  <path d="M120 256 L168 208 M120 256 L168 304" stroke="#38bdf8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Code Bracket Right > -->
  <path d="M392 256 L344 208 M392 256 L344 304" stroke="#c084fc" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Professional Geometric 'F' Logo -->
  <g filter="url(#glow)">
    <!-- Vertical Spine -->
    <rect x="204" y="148" width="34" height="216" rx="14" fill="url(#favGrad)" />
    
    <!-- Top Horizontal Bar -->
    <path d="M204 162 C204 154 210 148 218 148 L296 148 C308 148 316 158 314 170 C312 182 302 190 290 190 L238 190 L238 190 C226 190 218 182 218 170 Z" fill="url(#favGrad)" />
    
    <!-- Middle Horizontal Bar with Developer Slash Cut -->
    <path d="M220 238 L278 238 C288 238 296 246 294 256 C292 266 284 274 274 274 L220 274 Z" fill="url(#favGrad)" />
    
    <!-- Accent Dot (Active/Online status indicator in top right) -->
    <circle cx="304" cy="168" r="9" fill="#34d399" />
  </g>
</svg>
